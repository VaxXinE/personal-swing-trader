name: Verify API and build private Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run tests and HTTP smoke test
        run: |
          PYTHONPATH=backend python -m pytest -q backend/tests
          python scripts/server_smoke.py
      - name: Check JavaScript syntax
        run: node --check web/app.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffold
        working-directory: apps/mobile
        run: flutter create --project-name personal_swing_intelligence --platforms=android .
      - name: Configure required Internet permission
        run: python3 scripts/finalize_flutter.py
      - name: Analyze and build private release APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test
          flutter analyze
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: swing-intelligence-private-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
